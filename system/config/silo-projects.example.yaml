# 실제 값 파일은 `silo-projects.yaml`로 만들고 git에 올리지 않습니다.

version: 1

defaults:
  work_root:
  branch_prefix: silo
  execution_mode: yolo
  protected_branches:
    - main
    - master
    - dev
    - develop

projects:
  - id:
    name:
    repo_url:
    default_branch:
    protected_branches: []
    allowed_for_silo:
    role:
    service_policy:
      owner:
      startup:
      shared_by_silos:
