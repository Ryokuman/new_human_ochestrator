# 실제 값 파일은 `silo-projects.yaml`로 만들고 git에 올리지 않습니다.

version: 1

defaults:
  work_root:
  branch_prefix: silo
  # 사일로 시작 gate를 통과한 뒤 격리 clone 안에서 적용할 실행 모드입니다.
  # `yolo`는 내부 수정 승인 대기를 줄이는 모드이며, project SSoT task/issue 상태 갱신 PR 선행 gate를 생략하지 않습니다.
  execution_mode: yolo
  protected_branches:
    - main
    - master
    - dev
    - develop
    - release
    - production

projects:
  - id:
    name:
    repo_url:
    default_branch:
    protected_branches: []
    allowed_for_silo:
    role:
    repo_ownership:
      product_host_role:
      feature_submodule_owner:
      be_submodule_path:
      fe_submodule_path:
      harness_library_policy:
      scenario_adapter_location:
      notes: []
    db:
      uses_db:
      schema_canonical_path:
      schema_summary_path:
      schema_apply_path:
      notes: []
    service_policy:
      owner:
      startup:
      shared_by_silos:
