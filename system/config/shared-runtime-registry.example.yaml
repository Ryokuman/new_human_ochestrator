# 실제 값 파일은 `shared-runtime-registry.yaml`로 만들고 git에 올리지 않습니다.
# secret, token, password, credential 값은 기록하지 않습니다.

shared_runtimes:
  - project_id:
    runtime_set:
    runtime_name:
    runtime_kind:
    role:
    workspace_path:
    repo_remote:
    branch:
    commit:
    purpose:
    ports: []
    env_file_policy:
      path:
      rule:
    requires_health_check:
    health_check:
      command:
      url:
      expected:
      timeout_seconds:
      on_fail:
      skipped_reason:
    owner:
    last_checked:
    linked_tasks: []
    status:
