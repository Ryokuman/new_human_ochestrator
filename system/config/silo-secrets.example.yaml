# 실제 값 파일은 `silo-secrets.yaml`로 만들고 git에 올리지 않습니다.
# secret, token, password, credential 값은 기록하지 않습니다.

version: 1

policy:
  values: external_only
  allowed_sources:
    - environment
    - local_env_file
    - secret_manager
  forbidden:
    - inline_secret_values
    - production_credentials

providers:
  - id: example-provider
    kind: environment
    description: 실제 값은 환경 변수, gitignore된 로컬 env 파일, 또는 secret manager에 둡니다.
    required_keys:
      - EXAMPLE_SECRET_KEY
    injection:
      mode: env_reference
      target:
        path:
        rule: 필요한 경우 gitignore된 로컬 파일 경로만 적고 값은 적지 않습니다.

projects:
  - project_id: example-project
    provider_id: example-provider
    required_keys:
      - EXAMPLE_SECRET_KEY
    missing_secret_policy: user_confirmation_required
